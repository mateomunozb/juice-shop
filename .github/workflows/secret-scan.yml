name: SECRET_SCAN

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * 1" # optional: weekly full scan every Monday at 8am

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required: full history enables differential scanning

      - uses: fluidattacks/ss-action@0.3.0 # Use latest released version
        id: scan
        continue-on-error: true
        with:
          scan_config_path: .github/secret-scan-config.yaml
          scanner_mode: full

      - name: Explain scan result
        if: ${{ always() }}
        run: |
          echo "Scanner outcome: ${{ steps.scan.outcome }}"
          echo "Vulnerabilities found: ${{ steps.scan.outputs.vulnerabilities_found }}"
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "::error::Secret scanner execution failed. Review the scanner log above for configuration or runtime errors."
          elif [ "${{ steps.scan.outputs.vulnerabilities_found }}" = "true" ]; then
            echo "::error::Secret scan found vulnerabilities. The explicit failure gate will fail this job."
          else
            echo "No vulnerabilities were reported by the scanner."
          fi

      - name: Fail when secrets are found
        if: ${{ always() && (steps.scan.outcome != 'success' || steps.scan.outputs.vulnerabilities_found == 'true') }}
        run: |
          if [ "${{ steps.scan.outcome }}" != "success" ]; then
            echo "::error::Secret scanner failed before producing a successful result."
          else
            echo "::error::Secret vulnerabilities were found (vulnerabilities_found=true)."
          fi
          exit 1

      - name: Upload CSV report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: secret-scan-results.csv
          if-no-files-found: error