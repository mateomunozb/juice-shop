name: SECRET_SCAN

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fluid Attacks SECRET_SCAN
        id: scan
        uses: fluidattacks/ss-action@0.3.0
        with:
          scan_config_path: .github/secret-scan-config.yaml
          scanner_mode: full
        
      - name: Fail when vulnerabilities are found
        if: ${{ steps.scan.outputs.vulnerabilities_found == 'true' }}
        run: |
            echo "::error:: Fluid Attacks SAST encontro vulnerabilidades."
            exit 1
        
      - name: Upload CSV report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: secret-scan-results.csv
          if-no-files-found: error