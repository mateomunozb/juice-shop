name: SECRET_SCAN

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 8 * * 1" # optional: weekly full scan every Monday at 8am

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required: full history enables differential scanning

      - uses: fluidattacks/ss-action@0.3.0 # Use latest released version
        id: scan
        with:
          scan_config_path: .github/secret-scan-config.yaml
          scanner_mode: full

      - name: Fail when secrets are found
        if: ${{ always() && steps.scan.outputs.vulnerabilities_found == 'true' }}
        run: exit 1

      - name: Upload CSV report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: secret-scan-results.csv
          if-no-files-found: error