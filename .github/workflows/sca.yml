name: SCA

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fluid Attacks SCA
        id: scan
        uses: fluidattacks/sca-action@1.2.0
        with:
          scan_config_path: .github/sca-config.yaml
          scanner_mode: full
        
      - name: Fail when vulnerabilities are found
        if: ${{ steps.scan.outputs.vulnerabilities_found == 'true' }}
        run: |
            echo "::error:: Fluid Attacks SAST encontro vulnerabilidades."
            exit 1
        
      - name: Upload CSV report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: sca-results.csv
          if-no-files-found: error