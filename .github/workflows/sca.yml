name: SCA

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fluid Attacks SCA
        id: scan
        uses: fluidattacks/sca-action@1.2.0
        with:
          scan_config_path: .github/sca-config.yaml
          scanner_mode: full
        
      - name: Upload SARIF
        if: ${{ always() && steps.scan.outputs.sarif_file != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif_file }}