name: SCA
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: fluidattacks/sca-action@1.2.0
        with:
          scan_config_path: .github/sca-config.yaml
          scanner_mode: full